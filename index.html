
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <title>Skills Test</title>
</head>

<body class="bg-dark text-light">

    <div class="container mt-5">
        <div class="bg-secondary p-4 rounded">

            <h1 class="text-center">Periodic Table Information Finder</h1>
            <p class="text-center">Enter a non-metal element symbol to search</p>

            <label for="Element1" class="form-label">Element Symbol:</label>

            <input type="text" id="Element1" class="form-control" placeholder="Example: O">

            <button py-click="search_element" class="btn btn-info mt-3 w-100">
                Search Element
            </button>

            <div class="bg-dark p-3 rounded mt-4">

                <h3 class="text-center">Element Information</h3>

                <p><b>Element Symbol:</b><span id="symbol"></span></p>
                <p><b>Element Name:</b><span id="name"></span></p>
                <p><b>Atomic Number:</b><span id="number"></span></p>
                <p><b>Atomic Mass:</b><span id="mass"></span></p>

            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
